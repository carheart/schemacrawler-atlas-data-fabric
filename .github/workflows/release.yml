# Atlas Schema Extractor — release pipeline
# ─────────────────────────────────────────────────────────────────────
#
# Triggers on git tag push matching v* (e.g. v1.3.0). Builds the image
# for linux/amd64 + linux/arm64 in parallel, pushes to GHCR with three
# tags, and attaches Sigstore-signed build-provenance + SBOM
# attestations to the published manifest.
#
# How to cut a release:
#   git tag v1.3.0
#   git push origin v1.3.0
#
# The workflow then publishes:
#   ghcr.io/carheart/schemacrawler-atlas-data-fabric:1.3.0   (exact)
#   ghcr.io/carheart/schemacrawler-atlas-data-fabric:1.3     (rolling minor)
#   ghcr.io/carheart/schemacrawler-atlas-data-fabric:latest  (rolling)
#
# ── One-time setup (after the first successful run) ──────────────────
# 1. GitHub creates the GHCR package as PRIVATE by default. To make it
#    pullable without auth (the customer-facing flow), go to:
#      https://github.com/users/carheart/packages/container/schemacrawler-atlas-data-fabric/settings
#    Scroll to "Danger Zone" → "Change visibility" → Public.
# 2. While there, link the package to this repo if it isn't already
#    auto-linked: "Manage Actions access" → add this repo with Write.
#    The org.opencontainers.image.source label on the image points at
#    this repo so auto-linking should happen automatically on first push.

name: Publish container image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write          # GHCR push
  id-token: write          # Sigstore OIDC for attestation signing
  attestations: write      # actions/attest-build-provenance

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for cross-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # From a v1.3.0 tag push this emits three tags:
          #   1.3.0    (exact semver)
          #   1.3      (rolling minor)
          #   latest   (always)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          echo "## Published" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "**Provenance + SBOM:** attached" >> $GITHUB_STEP_SUMMARY
